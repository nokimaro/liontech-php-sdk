name: CI - Deep Validation

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 2 * * 1'  # Run at 2 AM on Mondays

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, openssl
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run mutation testing
        run: composer test:mutation

  live-integration-tests:
    name: Live Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run live integration tests
        env:
          LIONTECH_ACCESS_TOKEN: ${{ secrets.LIONTECH_ACCESS_TOKEN }}
          LIONTECH_REFRESH_TOKEN: ${{ secrets.LIONTECH_REFRESH_TOKEN }}
        run: vendor/bin/pest tests/Integration/Live
        if: env.LIONTECH_ACCESS_TOKEN != null
